<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>UI Exciter</title>
<style>
  /* Layout: one column. HUD (avatar, balance, persona, ambition) on top, Play/Profile/Shop tabs, then the active view */
  :root {
    --bg: #eef1f6;
    --fg: #1b2230;
    --muted: #677189;
    --card: #ffffff;
    --line: #d6dbe6;
    --track: #e3e7ef;
    --accent: #2f6bff;
    --accent-edge: #1d47b8;
    --up: #13804b;
    --down: #c43232;
    --font-display: "Bungee", "Arial Black", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111520; --fg: #e8ecf5; --muted: #8a93a8; --card: #1a2030; --line: #2c3448; --track: #252c3d;
      --accent: #4b7fff; --accent-edge: #2a4fb0; --up: #3ccf86; --down: #ff6b6b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111520; --fg: #e8ecf5; --muted: #8a93a8; --card: #1a2030; --line: #2c3448; --track: #252c3d;
    --accent: #4b7fff; --accent-edge: #2a4fb0; --up: #3ccf86; --down: #ff6b6b;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .label { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  /* HUD */
  .hud { display: flex; align-items: center; gap: 14px; }
  #hud-avatar {
    width: 76px; height: 76px; padding: 0; border: none; border-radius: 50%;
    background: none; cursor: pointer; flex: none;
  }
  .avatar { display: block; width: 100%; height: 100%; border-radius: 50%; }
  .balance { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #money {
    font-family: var(--font-display);
    font-size: clamp(2.1rem, 10.5vw, 3.2rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #money.neg { color: var(--down); }
  #money.bump { animation: bump 180ms ease-out; }
  @keyframes bump { 50% { transform: scale(1.1); } }
  .persona-chip {
    align-self: flex-start; font-size: 0.8rem; font-weight: 700;
    padding: 3px 10px; border-radius: 999px; border: 2px solid var(--level, var(--line));
  }

  .goal { display: flex; flex-direction: column; gap: 6px; }
  .goal-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.9rem; }
  .goal-row strong { min-width: 0; }
  .goal-row .meta { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .link { border: none; background: none; padding: 0 0 0 8px; color: var(--accent); font-weight: 700; cursor: pointer; font-size: 0.85rem; }
  .bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 300ms ease-out; }
  .goal .bar > span { background: var(--up); }

  /* Tabs */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tabs button { border: none; background: none; padding: 10px 4px; border-radius: 9px; font-weight: 700; cursor: pointer; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Play view */
  #progress { margin: 0; }
  #question { margin: 0; font-size: 1.2rem; line-height: 1.35; font-weight: 600; text-wrap: balance; }
  #choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    text-align: left; padding: 14px 16px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--bg); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .choice:disabled { cursor: default; opacity: 0.45; }
  .choice.picked { opacity: 1; border-color: var(--accent); }
  .choice .sub { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  .delta { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #result { display: flex; flex-direction: column; gap: 10px; }
  #result-delta { font-family: var(--font-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  #explain { margin: 0; line-height: 1.5; }
  #odds { margin: 0; font-size: 0.9rem; color: var(--muted); line-height: 1.4; }
  .fx { display: flex; flex-wrap: wrap; gap: 6px; }
  .fx span { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .banner { margin: 0; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--accent); font-weight: 600; line-height: 1.4; }
  .banner.slip { border-color: var(--down); }
  .banner.win { border-color: var(--up); }

  /* Onboarding reveal */
  .reveal { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .reveal .avatar-wrap { width: min(50vw, 180px); aspect-ratio: 1; max-width: 100%; }
  .reveal .big { font-family: var(--font-display); font-size: 1.6rem; margin: 0; }
  .reveal p { margin: 0; line-height: 1.5; max-width: 36ch; }
  .reveal .chipline { font-weight: 700; color: var(--muted); }
  .egg-stage { display: flex; justify-content: center; }
  .egg-stage .avatar-wrap { width: min(40vw, 150px); aspect-ratio: 1; max-width: 100%; }
  .hatch { position: relative; }
  .hatch > .shell { position: absolute; inset: 0; pointer-events: none; }

  /* Egg motion: an idle wobble, faster once cracked; the reveal shakes, splits and pops the animal out */
  .egg-body { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 2.6s ease-in-out infinite; }
  .egg-body.restless { animation-duration: 1.3s; }
  @keyframes wobble {
    0%, 55%, 100% { transform: rotate(0); }
    63% { transform: rotate(-7deg); }
    71% { transform: rotate(6deg); }
    79% { transform: rotate(-4deg); }
    87% { transform: rotate(2deg); }
  }
  .shell .both { transform-box: fill-box; transform-origin: 50% 100%; animation: shake 0.7s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-8deg); } 40% { transform: rotate(8deg); }
    60% { transform: rotate(-6deg); } 80% { transform: rotate(5deg); }
  }
  .shell .top { transform-box: fill-box; transform-origin: 50% 100%; animation: flyoff 0.7s ease-in 0.8s forwards; }
  .shell .bottom { animation: drop 0.7s ease-in 0.8s forwards; }
  .shell .cover { animation: fadeout 0.35s ease-out 0.8s forwards; }
  @keyframes flyoff { to { transform: translate(-30px, -140px) rotate(-40deg); opacity: 0; } }
  @keyframes drop { to { transform: translateY(90px); opacity: 0; } }
  @keyframes fadeout { to { opacity: 0; } }
  .hatch > .pet { animation: pop 0.55s cubic-bezier(.3, 1.6, .5, 1) 0.85s both; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .reveal .after { animation: fadein 0.4s ease-out 1.2s both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .primary {
    font-weight: 700; padding: 14px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-edge); cursor: pointer;
  }
  .primary:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-edge); }
  .primary:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; }
  .ghost { border: 2px solid var(--line); background: none; border-radius: 12px; padding: 12px; font-weight: 700; cursor: pointer; }

  /* Profile view */
  .profile-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .profile-head .avatar-wrap { width: min(50vw, 180px); aspect-ratio: 1; max-width: 100%; }
  #p-name { font-family: var(--font-display); font-size: 1.7rem; margin: 4px 0 0; }
  #p-risk { font-weight: 700; color: var(--muted); }
  #p-blurb, #p-next { margin: 0; line-height: 1.5; max-width: 36ch; }
  #p-next { color: var(--muted); font-size: 0.9rem; }
  .ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .ladder span { height: 8px; border-radius: 999px; background: var(--track); }
  .ladder-labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 0.7rem; color: var(--muted); text-align: center; margin-top: 6px; }
  .ladder-labels .on { color: var(--fg); font-weight: 700; }
  .traits { display: flex; flex-direction: column; gap: 12px; }
  .trait-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
  .trait-row .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .section-title { margin: 0; }
  #p-goals { margin: 0; padding-left: 1.2em; line-height: 1.6; }
  #p-goals-empty { margin: 0; color: var(--muted); }

  /* Style view */
  .stage { display: flex; justify-content: center; }
  .stage .avatar-wrap { width: min(60vw, 220px); aspect-ratio: 1; max-width: 100%; }
  .slots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .slots::-webkit-scrollbar { display: none; }
  .slots button {
    flex: none; border: 2px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .slots button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .tile {
    border: 2px solid var(--line); background: var(--bg); border-radius: 14px;
    padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
  }
  .tile .avatar-wrap { width: 64px; height: 64px; }
  .tile .name { font-size: 0.85rem; font-weight: 600; text-align: center; line-height: 1.2; }
  .tile .tag { font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
  .tile.wearing { border-color: var(--accent); }
  .tile.wearing .tag { color: var(--accent); }
  .tile.selected { border-color: var(--fg); }
  .tile.locked .tag { color: var(--muted); }
  .tile.earned .tag { color: var(--up); }
  .buybar { display: flex; flex-direction: column; gap: 8px; }
  .buybar .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  #buy-note { margin: 0; text-align: center; color: var(--muted); font-size: 0.9rem; }
  #reset { align-self: center; border: none; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px; font-size: 0.85rem; }

  @media (prefers-reduced-motion: reduce) {
    #money.bump { animation: none; }
    .bar > span { transition: none; }
    .egg-body, .shell .both, .hatch > .pet, .reveal .after { animation: none; }
    .hatch > .shell { display: none; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600;700&display=swap">

<!-- Shared SVG paint servers, referenced by every avatar on the page -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="c-round"><circle cx="100" cy="100" r="100"/></clipPath>
    <linearGradient id="g-midnight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2340"/><stop offset="1" stop-color="#3b2a5c"/></linearGradient>
    <linearGradient id="g-sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f61"/><stop offset=".55" stop-color="#ffa36c"/><stop offset="1" stop-color="#ffd86f"/></linearGradient>
    <linearGradient id="g-sunrise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fcfff"/><stop offset="1" stop-color="#ffe6b8"/></linearGradient>
    <linearGradient id="g-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0a24"/><stop offset="1" stop-color="#3a0f5c"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#f2b81d"/><stop offset="1" stop-color="#a8740a"/></linearGradient>
    <linearGradient id="g-chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fa"/><stop offset=".35" stop-color="#9aa3b5"/><stop offset=".6" stop-color="#e6e9f0"/><stop offset="1" stop-color="#6f788c"/></linearGradient>
    <linearGradient id="g-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f55"/><stop offset="1" stop-color="#0e0f14"/></linearGradient>
    <linearGradient id="g-visor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#a14bff"/><stop offset="1" stop-color="#ff4fb3"/></linearGradient>
    <pattern id="p-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 0H16M0 0V16" stroke="#ff4fd8" stroke-width="1.2" fill="none"/></pattern>
    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

</svg>

<main>
  <div class="hud">
    <button id="hud-avatar" type="button" aria-label="Open your profile"></button>
    <div class="balance">
      <span class="label">Balance</span>
      <span id="money">$0</span>
      <span id="persona-chip" class="persona-chip"></span>
    </div>
  </div>

  <div class="goal" id="goal-block">
    <div class="goal-row">
      <strong id="goal-name"></strong>
      <span><span id="goal-meta" class="meta"></span><button id="goal-change" class="link" type="button">Change</button></span>
    </div>
    <div class="bar" role="progressbar" aria-label="Ambition progress" aria-valuemin="0" aria-valuemax="100" id="goal-bar"><span id="goal-fill"></span></div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button id="tab-play" type="button" role="tab" aria-selected="true">Play</button>
    <button id="tab-profile" type="button" role="tab" aria-selected="false">Profile</button>
    <button id="tab-style" type="button" role="tab" aria-selected="false">Shop</button>
  </div>

  <section id="view-play" class="card" aria-live="polite">
    <p id="progress" class="label"></p>
    <h1 id="question"></h1>
    <div id="choices"></div>
    <div id="result" hidden>
      <span id="result-delta"></span>
      <p id="explain"></p>
      <p id="odds" hidden></p>
      <div id="fx" class="fx"></div>
      <div id="banners"></div>
    </div>
    <button id="next" class="primary" type="button" hidden>Next question</button>
  </section>

  <section id="view-profile" class="card" hidden>
    <div class="profile-head">
      <div id="p-avatar" class="avatar-wrap"></div>
      <h2 id="p-name"></h2>
      <span id="p-risk"></span>
      <p id="p-blurb"></p>
    </div>
    <div>
      <div class="ladder" id="p-ladder"></div>
      <div class="ladder-labels" id="p-ladder-labels"></div>
    </div>
    <p id="p-next"></p>
    <h3 class="label section-title">Financial traits</h3>
    <div class="traits" id="p-traits"></div>
    <h3 class="label section-title">Ambitions achieved</h3>
    <ul id="p-goals"></ul>
    <p id="p-goals-empty">None yet. Reach your current ambition to add one here.</p>
  </section>

  <section id="view-style" class="card" hidden>
    <div class="stage"><div id="stage-avatar" class="avatar-wrap"></div></div>
    <div class="slots" id="slots"></div>
    <div class="grid" id="items"></div>
    <div class="buybar" id="buybar" hidden>
      <div class="row">
        <button id="buy" class="primary" type="button">Buy</button>
        <button id="cancel" class="ghost" type="button">Cancel</button>
      </div>
      <p id="buy-note"></p>
    </div>
    <button id="reset" type="button">Reset game</button>
  </section>
</main>

<script>
  // ================= Game data (edit freely) =================
  const START_MONEY = 1000;

  // Ambitions: what the player is saving towards. Progress = balance / target.
  const GOALS = [
    { id: 'emergency', name: 'Emergency fund', target: 2500, desc: 'Three months of essentials, set aside for surprises' },
    { id: 'holiday', name: 'Dream holiday', target: 4000, desc: 'Two weeks somewhere far away, paid in full' },
    { id: 'car', name: 'First car', target: 8000, desc: 'A reliable used car, no finance' },
    { id: 'house', name: 'House deposit', target: 15000, desc: 'A 10% deposit on a first home' },
    { id: 'retire', name: 'Retire early', target: 30000, desc: 'A head start on financial independence' },
  ];

  // Traits are 0–100. Each choice nudges the traits it names towards the given value,
  // so recent behaviour counts most and the profile keeps evolving.
  const TRAITS = [
    { id: 'risk', name: 'Risk appetite' },
    { id: 'discipline', name: 'Discipline' },
    { id: 'planning', name: 'Long-term planning' },
    { id: 'resilience', name: 'Resilience' },
  ];
  const START_TRAITS = { risk: 50, discipline: 45, planning: 45, resilience: 45 };
  const TRAIT_RATE = 0.3;

  // Two setup questions. Each answer sets starting traits directly and a `band` (0 low, 1 mid, 2 high)
  // that, together, picks the player's animal.
  const SETUP = [
    {
      q: "Your savings drop 20% in a month. How do you feel?",
      choices: [
        { text: "Panicked. I'd pull everything out", band: 0, traits: { risk: 20, resilience: 30 } },
        { text: "Uneasy, but I'd wait it out", band: 1, traits: { risk: 50, resilience: 55 } },
        { text: "Excited. I'd buy more while it's cheap", band: 2, traits: { risk: 85, resilience: 60 } },
      ],
    },
    {
      q: "Payday arrives. What usually happens?",
      choices: [
        { text: "It's mostly gone within a week", band: 0, traits: { discipline: 25, planning: 25 } },
        { text: "Bills first, then I spend what's left", band: 1, traits: { discipline: 50, planning: 40 } },
        { text: "Savings go out first, then I spend", band: 2, traits: { discipline: 65, planning: 60 } },
      ],
    },
  ];
  // ANIMAL_FOR[riskBand][disciplineBand]
  const ANIMAL_FOR = [
    ['bunny', 'panda', 'bear'],
    ['bunny', 'panda', 'cat'],
    ['frog', 'fox', 'fox'],
  ];

  // Maturity ladder. Level comes from discipline, planning and resilience; risk is a separate axis.
  const PERSONAS = [
    { name: 'Firefighter', color: '#ff5a5a', blurb: 'Putting out fires. No buffer yet, so every surprise hurts.',
      next: 'Get your balance positive and choose options that protect you from shocks.' },
    { name: 'Enjoyer', color: '#ffb84a', blurb: 'Earning and spending. Life is good today, less so for future you.',
      next: 'Show some spending discipline and think a little further ahead to become a Saver.' },
    { name: 'Saver', color: '#2fbf8a', blurb: 'A buffer in place and expensive debt under control.',
      next: 'Put money to work for the long term to become a Builder.' },
    { name: 'Builder', color: '#4b7fff', blurb: 'Investing regularly, with goals that have dates on them.',
      next: 'Keep making strong long-term choices and achieve an ambition to become a Strategist.' },
    { name: 'Strategist', color: 'url(#g-gold)', chip: '#e0a91a', blurb: 'Money works for you. Risks are calculated and sized to match.',
      next: 'Top of the ladder. Stay here by keeping your habits.' },
  ];

  // A choice has either a fixed `delta` + `why`, or `outcomes`: [{ p, delta, why }]
  // where p values add up to 1 and one outcome is rolled when the player picks it.
  // `traits` describes the behaviour, so it applies whatever the outcome.
  const QUESTIONS = [
    {
      q: "A coworker swears a new crypto coin is about to take off.",
      choices: [
        { text: "Put $500 in", traits: { risk: 90, discipline: 35 }, outcomes: [
          { p: 0.3, delta: 1500, why: "It took off. You sold at the top and tripled your money." },
          { p: 0.7, delta: -450, why: "It crashed 90% within a month. Your coworker has stopped mentioning it." },
        ]},
        { text: "Put in $100 you can afford to lose", traits: { risk: 65, discipline: 70, resilience: 65 }, outcomes: [
          { p: 0.3, delta: 300, why: "It took off. A small bet, a nice win." },
          { p: 0.7, delta: -90, why: "It crashed, but you only bet what you could afford to lose." },
        ]},
        { text: "Pass", traits: { risk: 20 }, delta: 0, why: "No upside, no downside." },
      ],
    },
    {
      q: "You have $1,000 spare to set aside for the next five years.",
      choices: [
        { text: "Global index fund", traits: { risk: 55, planning: 85 }, outcomes: [
          { p: 0.8, delta: 350, why: "Markets had their ups and downs, but broadly rose. Diversification did its job." },
          { p: 0.2, delta: -100, why: "A rough patch for markets. You're down a little, but still invested for the long run." },
        ]},

      ${item('outfit', look.outfit).draw(headColor)}
      ${a.back(f, d, l)}
      <ellipse cx="${h.cx}" cy="${h.cy}" rx="${h.rx}" ry="${h.ry}" fill="${headColor}"/>
      ${a.face(f, d, l)}
      <circle cx="72" cy="106" r="7" fill="#ff7a9a" opacity=".35"/><circle cx="128" cy="106" r="7" fill="#ff7a9a" opacity=".35"/>
      ${eyeSvg}
      <g transform="translate(0 ${a.mouthDY || 0})">${nose}${MOUTHS[mood] || MOUTHS.neutral}</g>
      ${a.front ? a.front() : ''}
      <g transform="translate(100 ${eyeY}) scale(${dx / 18} 1) translate(-100 -92)">${eyes.draw()}</g>
      <g transform="translate(0 ${a.hatDY || 0})">${head.draw()}</g>
      ${ring}
    </g></svg>`;
  }

  // ================= State =================
  const SAVE_KEY = 'ui-exciter-save-v2';
  let money = START_MONEY;
  let setupStep = 0;      // 0–1 setup questions, 2 animal reveal, 3 done
  let bands = [];         // setup answer bands
  let index = 0;          // current question
  let picked = null;      // chosen answer index for current question
  let roll = null;        // which outcome was rolled, for risky choices
  let owned = [];         // "slot:item" keys of bought items (free items are always owned)
  let look = { ...DEFAULT_LOOK };
  let goal = null;        // current ambition id
  let achieved = [];      // ambition ids reached
  let traits = { ...START_TRAITS };
  let bestLevel = 1;      // highest persona level reached; unlocks stay earned
  let fx = null;          // what the last answer changed, shown with its result
  let mood = 'neutral';
  let view = 'play';
  let shopSlot = 'species';
  let preview = null;     // item id being previewed (not yet owned) in shopSlot
  let resetArmed = false;

  function snapshot() {
    return { money, setupStep, bands, index, picked, roll, owned, look, goal, achieved, traits, bestLevel, fx };
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); } catch {}
  }
  function loadSaved() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch { return {}; }
  }
  function applyState(d) {
    if (typeof d.money === 'number') money = d.money;
    if (typeof d.setupStep === 'number') setupStep = d.setupStep;
    if (Array.isArray(d.bands)) bands = d.bands;
    if (typeof d.index === 'number') index = d.index;
    if (d.picked === null || typeof d.picked === 'number') picked = d.picked ?? null;
    if (d.roll === null || typeof d.roll === 'number') roll = d.roll ?? null;
    if (Array.isArray(d.owned)) owned = d.owned;
    if (d.look) look = { ...DEFAULT_LOOK, ...d.look };
    if (d.goal === null || typeof d.goal === 'string') goal = d.goal ?? null;
    if (Array.isArray(d.achieved)) achieved = d.achieved;
    if (d.traits) traits = { ...START_TRAITS, ...d.traits };
    if (typeof d.bestLevel === 'number') bestLevel = d.bestLevel;
    if (d.fx !== undefined) fx = d.fx;
  }

  // ================= Derived identity =================
  const maturity = () => (traits.discipline + traits.planning + traits.resilience) / 3;
  function levelOf() {
    if (money < 0) return 0;
    const m = maturity();
    const l = m < 35 ? 0 : m < 50 ? 1 : m < 62 ? 2 : m < 75 ? 3 : 4;
    return l === 4 && achieved.length === 0 ? 3 : l;  // Strategist needs an achieved ambition
  }
  const riskStyle = () => (traits.risk < 35 ? 'Cautious' : traits.risk < 65 ? 'Measured' : 'Risk-taker');
  const isUnlocked = (it) => !it.unlock || bestLevel >= it.unlock;
  const isOwned = (slot, it) => (it.price === 0 && isUnlocked(it)) || owned.includes(slot + ':' + it.id);
  const goalOf = (id) => GOALS.find((g) => g.id === id);
  const onboarded = () => setupStep >= 3;

  // ================= Rendering =================
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString();
  const fmtDelta = (n) => (n > 0 ? '+' : n < 0 ? '−' : '±') + '$' + Math.abs(n).toLocaleString();
  const signClass = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : '');
  const resultOf = (c, r) => (c.outcomes ? c.outcomes[r ?? 0] : c);
  function rollOutcome(c) {
    if (!c.outcomes) return null;
    let x = Math.random();
    for (let i = 0; i < c.outcomes.length; i++) { x -= c.outcomes[i].p; if (x < 0) return i; }
    return c.outcomes.length - 1;
  }

  function renderMoney(animate) {
    const el = $('money');
    el.textContent = fmt(money);
    el.classList.toggle('neg', money < 0);
    if (animate) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }

  function renderHud() {
    const lvl = levelOf();
    const ready = onboarded();
    // Before setup finishes the animal isn't decided yet, so show the egg.
    $('hud-avatar').innerHTML = setupStep <= SETUP.length ? eggSVG(Math.min(setupStep, 1)) : avatarSVG(look, mood, ready ? lvl : null);
    renderMoney(false);
    const chip = $('persona-chip');
    chip.hidden = !ready;
    chip.textContent = PERSONAS[lvl].name + ' · ' + riskStyle();
    chip.style.setProperty('--level', PERSONAS[lvl].chip || PERSONAS[lvl].color);
    $('goal-block').hidden = !ready;
    $('tabs').hidden = !ready;

    const g = goalOf(goal);
    if (!g) {
      $('goal-name').textContent = 'No ambition set';
      $('goal-meta').textContent = '';
      $('goal-change').textContent = 'Choose';
      $('goal-fill').style.width = '0%';
      $('goal-bar').setAttribute('aria-valuenow', 0);
    } else {
      const pct = Math.max(0, Math.min(100, Math.round((money / g.target) * 100)));
      $('goal-name').textContent = g.name;
      $('goal-meta').textContent = pct + '% of ' + fmt(g.target);
      $('goal-change').textContent = 'Change';
      $('goal-fill').style.width = pct + '%';
      $('goal-bar').setAttribute('aria-valuenow', pct);
    }
  }

  function renderTabs() {
    if (!onboarded()) view = 'play';
    for (const v of ['play', 'profile', 'style']) {
      $('tab-' + v).setAttribute('aria-selected', view === v);
      $('view-' + v).hidden = view !== v;
    }
  }

  function choiceButton(text, sub) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice';
    const label = document.createElement('span');
    label.textContent = text;
    if (sub) {
      const s = document.createElement('span');
      s.className = 'sub';
      s.textContent = sub;
      label.append(s);
    }
    b.append(label);
    return b;
  }

  function hidePlayExtras() {
    $('result').hidden = true;
    $('next').hidden = true;
  }

  function renderSetupQuestion(step) {
    const s = SETUP[step];
    $('progress').textContent = (step === 0 ? 'Something is stirring' : 'It\'s cracking') + ' · ' + (step + 1) + ' of ' + SETUP.length;
    $('question').textContent = s.q;
    hidePlayExtras();
    const egg = document.createElement('div');
    egg.className = 'egg-stage';
    egg.innerHTML = `<div class="avatar-wrap">${eggSVG(step)}</div>`;
    $('choices').replaceChildren(egg, ...s.choices.map((c) => {
      const b = choiceButton(c.text);
      b.addEventListener('click', () => answerSetup(c));
      return b;
    }));
  }

  function renderReveal() {
    const a = item('species', look.species);
    const lvl = levelOf();
    $('progress').textContent = 'Meet your money self';
    $('question').textContent = 'It\'s hatching!';
    const wrap = document.createElement('div');
    wrap.className = 'reveal';
    wrap.innerHTML = `<div class="avatar-wrap hatch"><div class="pet">${avatarSVG(look, 'happy', lvl)}</div><div class="shell">${HATCH_SHELL}</div></div>
      <p class="big after"></p>
      <p class="tagline after"></p>
      <p class="chipline after"></p>
      <p class="blurb after"></p>`;
    wrap.querySelector('.big').textContent = 'You\'re a ' + a.name + '!';
    wrap.querySelector('.tagline').textContent = a.tagline;
    wrap.querySelector('.chipline').textContent = 'Starting as: ' + PERSONAS[lvl].name + ' · ' + riskStyle();
    wrap.querySelector('.blurb').textContent = PERSONAS[lvl].blurb + ' Every choice you make from here shapes who you become.';
    $('choices').replaceChildren(wrap);
    $('result').hidden = true;
    $('next').textContent = 'Choose an ambition';
    $('next').hidden = false;
  }

  function renderGoalPicker() {
    $('progress').textContent = achieved.length ? 'New ambition' : 'One more thing';
    $('question').textContent = 'What are you saving towards?';
    hidePlayExtras();
    $('choices').replaceChildren(...GOALS.map((g) => {
      const b = choiceButton(g.name, g.desc);
      const t = document.createElement('span');
      t.className = 'delta';
      const done = achieved.includes(g.id), covered = money >= g.target;
      t.textContent = done ? 'Achieved' : covered ? 'Already covered' : fmt(g.target);
      b.disabled = done || covered;
      b.append(t);
      b.addEventListener('click', () => { goal = g.id; save(); renderAll(); });
      return b;
    }));
  }

  function renderFx() {
    const fxEl = $('fx'), bannersEl = $('banners');
    fxEl.replaceChildren();
    bannersEl.replaceChildren();
    if (!fx) return;
    for (const t of TRAITS) {
      const d = fx.traits?.[t.id];
      if (!d) continue;
      const s = document.createElement('span');
      s.className = d > 0 ? 'up' : 'down';
      s.textContent = t.name + ' ' + (d > 0 ? '+' : '−') + Math.abs(d);
      fxEl.append(s);
    }
    const banner = (text, cls) => {
      const p = document.createElement('p');
      p.className = 'banner ' + (cls || '');
      p.textContent = text;
      bannersEl.append(p);
    };
    if (fx.goalHit) banner('Ambition achieved: ' + fx.goalHit + '. Pick your next one after this question.', 'win');
    if (fx.shift) {
      const up = fx.shift.to > fx.shift.from;
      banner((up ? 'Level up: ' : 'Slipped back: ') + PERSONAS[fx.shift.from].name + ' → ' + PERSONAS[fx.shift.to].name, up ? '' : 'slip');
    }
    if (fx.unlocked?.length) banner('Unlocked in the shop: ' + fx.unlocked.join(', ') + '.', 'win');
  }

  function renderPlay() {
    if (setupStep < SETUP.length) { renderSetupQuestion(setupStep); return; }
    if (setupStep === SETUP.length) { renderReveal(); return; }
    if (goal === null && picked === null) { renderGoalPicker(); return; }

    const choicesEl = $('choices');
    choicesEl.replaceChildren();
    const resultEl = $('result'), deltaEl = $('result-delta'), nextBtn = $('next');

    if (index >= QUESTIONS.length) {
      $('progress').textContent = 'Round over';
      $('question').textContent = 'You finished the round with ' + fmt(money) + '.';
      resultEl.hidden = false;
      deltaEl.textContent = '';
      $('odds').hidden = true;
      $('explain').textContent = 'Check your Profile to see how your choices shaped you, or play another round.';
      fx = null;
      renderFx();
      nextBtn.textContent = 'Play another round';
      nextBtn.hidden = false;
      return;
    }

    const q = QUESTIONS[index];
    $('progress').textContent = 'Question ' + (index + 1) + ' of ' + QUESTIONS.length;
    $('question').textContent = q.q;

    q.choices.forEach((c, i) => {
      const b = choiceButton(c.text);
      if (picked !== null) {
        b.disabled = true;
        if (i === picked) {
          b.classList.add('picked');
          const r = resultOf(c, roll);
          const d = document.createElement('span');
          d.className = 'delta ' + signClass(r.delta);
          d.textContent = fmtDelta(r.delta);
          b.append(d);
        }
      }
      b.addEventListener('click', () => choose(i));
      choicesEl.append(b);
    });

    if (picked === null) {
      hidePlayExtras();
    } else {
      const c = q.choices[picked];
      const r = resultOf(c, roll);
      resultEl.hidden = false;
      deltaEl.textContent = fmtDelta(r.delta);
      deltaEl.className = signClass(r.delta);
      $('explain').textContent = r.why;
      $('odds').hidden = !c.outcomes;
      if (c.outcomes) {
        $('odds').textContent = 'Risky pick. The odds were: ' +
          c.outcomes.map((o) => Math.round(o.p * 100) + '% chance of ' + fmtDelta(o.delta)).join(', ') + '.';
      }
      renderFx();
      nextBtn.textContent = index + 1 < QUESTIONS.length ? 'Next question' : 'Finish round';
      nextBtn.hidden = false;
    }
  }

  function renderProfile() {
    const lvl = levelOf();
    const p = PERSONAS[lvl];
    const a = item('species', look.species);
    $('p-avatar').innerHTML = avatarSVG(look, mood, lvl);
    $('p-name').textContent = p.name;
    $('p-risk').textContent = a.name + ' · ' + riskStyle() + ' with risk';
    $('p-blurb').textContent = p.blurb;
    $('p-next').textContent = p.next;

    $('p-ladder').replaceChildren(...PERSONAS.map((x, i) => {
      const s = document.createElement('span');
      if (i <= lvl) s.style.background = x.chip || x.color;
      return s;
    }));
    $('p-ladder-labels').replaceChildren(...PERSONAS.map((x, i) => {
      const s = document.createElement('span');
      s.textContent = x.name;
      if (i === lvl) s.className = 'on';
      return s;
    }));

    $('p-traits').replaceChildren(...TRAITS.map((t) => {
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="trait-row"><span></span><span class="meta"></span></div>
        <div class="bar"><span></span></div>`;
      wrap.querySelector('.trait-row span').textContent = t.name;
      wrap.querySelector('.meta').textContent = traits[t.id] + ' / 100';
      wrap.querySelector('.bar span').style.width = traits[t.id] + '%';
      return wrap;
    }));

    const done = GOALS.filter((g) => achieved.includes(g.id));
    $('p-goals').replaceChildren(...done.map((g) => {
      const li = document.createElement('li');
      li.textContent = g.name + ' (' + fmt(g.target) + ')';
      return li;
    }));
    $('p-goals').hidden = !done.length;
    $('p-goals-empty').hidden = !!done.length;
  }

  function renderStyle() {
    const shown = preview ? { ...look, [shopSlot]: preview } : look;
    $('stage-avatar').innerHTML = avatarSVG(shown, mood, levelOf());

    $('slots').replaceChildren(...SLOTS.map((s) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.name;
      b.setAttribute('aria-pressed', s.id === shopSlot);
      b.addEventListener('click', () => { shopSlot = s.id; preview = null; renderStyle(); });
      return b;
    }));

    $('items').replaceChildren(...SLOT[shopSlot].items.map((it) => {
      const b = document.createElement('button');
      b.type = 'button';
      const have = isOwned(shopSlot, it);
      const wearing = look[shopSlot] === it.id;
      const levelLocked = !isUnlocked(it);
      let tag;
      if (wearing) tag = shopSlot === 'species' ? 'You' : 'Wearing';
      else if (levelLocked) tag = 'Reach ' + PERSONAS[it.unlock].name;
      else if (it.unlock) tag = 'Earned';
      else if (have) tag = it.price ? 'Owned' : 'Free';
      else tag = fmt(it.price);
      b.className = 'tile' + (wearing ? ' wearing' : '') + (preview === it.id ? ' selected' : '') +
        (levelLocked || (!have && it.price > money) ? ' locked' : '') + (it.unlock && !levelLocked && !wearing ? ' earned' : '');
      b.innerHTML = `<div class="avatar-wrap">${avatarSVG({ ...look, [shopSlot]: it.id })}</div>
        <span class="name"></span><span class="tag"></span>`;
      b.querySelector('.name').textContent = it.name;
      b.querySelector('.tag').textContent = tag;
      b.addEventListener('click', () => pickItem(it));
      return b;
    }));

    const bar = $('buybar');
    if (!preview) { bar.hidden = true; return; }
    const it = item(shopSlot, preview);
    bar.hidden = false;
    const buy = $('buy');
    if (!isUnlocked(it)) {
      buy.textContent = 'Locked';
      buy.disabled = true;
      $('buy-note').textContent = 'Reach ' + PERSONAS[it.unlock].name + ' to unlock this. Maturity can\'t be bought.';
      return;
    }
    buy.textContent = 'Buy ' + it.name + ' for ' + fmt(it.price);
    buy.disabled = money < it.price;
    $('buy-note').textContent = money < it.price
      ? 'You need ' + fmt(it.price - money) + ' more. Play a round to earn it.'
      : 'Leaves you with ' + fmt(money - it.price) + '.';
  }

  function renderAll() {
    renderHud();
    renderTabs();
    renderPlay();
    renderProfile();
    renderStyle();
  }

  // ================= Actions =================
  function answerSetup(c) {
    Object.assign(traits, c.traits);
    bands[setupStep] = c.band;
    setupStep += 1;
    if (setupStep === SETUP.length) {
      look.species = ANIMAL_FOR[bands[0]][bands[1]];
      bestLevel = Math.max(1, levelOf());
      mood = 'happy';
    }
    save();
    renderAll();
  }

  function choose(i) {
    if (picked !== null) return;
    const before = levelOf();
    const c = QUESTIONS[index].choices[i];
    picked = i;
    roll = rollOutcome(c);
    const d = resultOf(c, roll).delta;
    money += d;
    mood = d > 0 ? 'happy' : d < 0 ? 'sad' : 'neutral';

    // Traits follow the behaviour, not the luck.
    const traitFx = {};
    for (const [k, target] of Object.entries(c.traits || {})) {
      const next = Math.round(traits[k] + (target - traits[k]) * TRAIT_RATE);
      if (next !== traits[k]) traitFx[k] = next - traits[k];
      traits[k] = next;
    }

    let goalHit = null;
    const g = goalOf(goal);
    if (g && money >= g.target) {
      if (!achieved.includes(g.id)) achieved.push(g.id);
      goalHit = g.name;
      goal = null;
    }

    const after = levelOf();
    const unlocked = [];
    if (after > bestLevel) {
      for (const s of SLOTS) for (const it of s.items) {
        if (it.unlock && it.unlock > bestLevel && it.unlock <= after) unlocked.push(it.name);
      }
      bestLevel = after;
    }
    if (after > before) mood = 'happy';
    fx = { traits: traitFx, shift: after !== before ? { from: before, to: after } : null, unlocked, goalHit };

    save();
    renderAll();
    renderMoney(true);
    $('next').focus({ preventScroll: true });
  }

  $('next').addEventListener('click', () => {
    if (setupStep === SETUP.length) {
      setupStep += 1;
      mood = 'neutral';
      save();
      renderAll();
      return;
    }
    index = index >= QUESTIONS.length ? 0 : index + 1;  // new round keeps your balance
    picked = null;
    roll = null;
    fx = null;
    mood = 'neutral';
    save();
    renderAll();
    window.scrollTo({ top: 0 });
  });

  $('goal-change').addEventListener('click', () => {
    goal = null;
    view = 'play';
    save();
    renderAll();
  });

  function pickItem(it) {
    if (isOwned(shopSlot, it)) {
      look[shopSlot] = it.id;
      preview = null;
      save();
    } else {
      preview = preview === it.id ? null : it.id;
    }
    renderHud();
    renderProfile();
    renderStyle();
  }

  $('buy').addEventListener('click', () => {
    if (!preview) return;
    const it = item(shopSlot, preview);
    if (!isUnlocked(it) || money < it.price) return;
    money -= it.price;
    owned.push(shopSlot + ':' + it.id);
    look[shopSlot] = it.id;
    preview = null;
    mood = 'happy';
    save();
    renderAll();
    renderMoney(true);
  });
  $('cancel').addEventListener('click', () => { preview = null; renderStyle(); });

  function setView(v) {
    if (!onboarded()) return;
    view = v;
    preview = null;
    renderTabs();
    renderProfile();
    renderStyle();
  }
  $('tab-play').addEventListener('click', () => setView('play'));
  $('tab-profile').addEventListener('click', () => setView('profile'));
  $('tab-style').addEventListener('click', () => setView('style'));
  $('hud-avatar').addEventListener('click', () => setView('profile'));

  $('reset').addEventListener('click', () => {
    const btn = $('reset');
    if (!resetArmed) {
      resetArmed = true;
      btn.textContent = 'Tap again to wipe everything';
      setTimeout(() => { resetArmed = false; btn.textContent = 'Reset game'; }, 4000);
      return;
    }
    resetArmed = false;
    btn.textContent = 'Reset game';
    money = START_MONEY; setupStep = 0; bands = []; index = 0; picked = null; roll = null; owned = [];
    look = { ...DEFAULT_LOOK }; goal = null; achieved = []; traits = { ...START_TRAITS }; bestLevel = 1; fx = null;
    mood = 'neutral'; preview = null; view = 'play';
    save();
    renderAll();
  });

  // ================= Boot =================
  function start(data) {
    applyState(loadSaved());
    if (data && typeof data.money === 'number') applyState(data);
    if (onboarded()) bestLevel = Math.max(bestLevel, levelOf());
    renderAll();
  }
  window.claude?.hot?.snapshot?.(snapshot);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
